<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc"><title id="title">Video homepage component boundaries</title><desc id="desc">An annotated reconstruction: red boxes mark header, sidebar, and video grid; blue boxes mark reusable search, subscribe, and thumbnail components.</desc><rect width="960" height="620" fill="#f7f3e8"/><g font-family="Verdana" font-size="16"><text x="30" y="32" font-size="20">Component study · labelled reconstruction</text><g fill="none" stroke="#b83232" stroke-width="3"><rect x="25" y="55" width="910" height="90"/><rect x="25" y="165" width="160" height="420"/><rect x="205" y="165" width="730" height="420"/></g><g fill="#9b2525"><text x="40" y="80">Header</text><text x="40" y="195">Sidebar</text><text x="225" y="195">VideoGrid</text></g><g fill="#fffdf8" stroke="#3264bc" stroke-width="2"><rect x="265" y="78" width="400" height="42"/><rect x="735" y="78" width="170" height="42"/><rect x="230" y="220" width="210" height="150"/><rect x="465" y="220" width="210" height="150"/><rect x="700" y="220" width="210" height="150"/><rect x="230" y="400" width="210" height="150"/><rect x="465" y="400" width="210" height="150"/><rect x="700" y="400" width="210" height="150"/></g><g fill="#234f9e"><text x="285" y="105">SearchBar(query,onSearch)</text><text x="750" y="105">SubscribeButton</text><text x="245" y="255">VideoThumbnail</text><text x="480" y="255">VideoThumbnail</text><text x="715" y="255">VideoThumbnail</text><text x="245" y="435">VideoThumbnail</text><text x="480" y="435">VideoThumbnail</text><text x="715" y="435">VideoThumbnail</text></g><g fill="#39423d" font-size="12"><text x="245" y="285">Props: image, title, channel,</text><text x="245" y="305">views, duration, videoUrl</text><text x="480" y="285">Same component;</text><text x="480" y="305">different props.</text><text x="40" y="230">Navigation items</text><text x="30" y="610">RED = layout region · BLUE = reusable child · This diagram is not a live YouTube screenshot.</text></g></g></svg>
