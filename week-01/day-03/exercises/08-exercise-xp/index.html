<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Functions & DOM Lab</title><style>body{max-width:900px;margin:40px auto;padding:0 24px;background:#f5f0e5;color:#24352d;font-family:Georgia,serif}h1{font-size:clamp(2.5rem,7vw,4rem)}section,article{border-top:1px solid #aab5aa;padding:24px 0}button{background:#244f40;color:white;border:0;padding:12px 18px;font:inherit;cursor:pointer}.listBooks{display:flex;gap:32px}.listBooks div{max-width:240px}li{padding:6px}nav ul{display:flex;gap:16px;flex-wrap:wrap;list-style:none;padding:0}pre{white-space:pre-wrap}</style></head><body><p>BOOTCAMP / DAY 03</p><h1>Functions & DOM Lab</h1><article><h2>Vacation calculator</h2><button id="vacation">Plan a trip</button><pre id="cost" aria-live="polite"></pre></article><section><h2>Users</h2><div id="container">Users:</div><ul class="list"><li>John</li><li>Pete</li></ul><ul class="list"><li>David</li><li>Sarah</li><li>Dan</li></ul><p id="greeting"></p></section><section><h2>Social navigation</h2><nav id="navBar"><ul><li><a href="#">Profile</a></li><li><a href="#">Home</a></li><li><a href="#">My Friends</a></li><li><a href="#">Messenger</a></li><li><a href="#">My Pics</a></li></ul></nav></section><h2>My book list</h2><section class="listBooks"></section><script src="solutions.js"></script><script>
updateUsers(document,message=>{document.querySelector('#greeting').textContent=message;});changeNavbar(document);renderBooks(document);
document.querySelector('#vacation').addEventListener('click',()=>{const lines=[];const result=totalVacationCost(message=>window.prompt(message),line=>lines.push(line));document.querySelector('#cost').textContent=result?lines.join('\n'):'Cancelled.';});
</script></body></html>
