<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coloring Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e6;color:#1c3738;font:16px Georgia,serif}main{max-width:1200px;margin:auto;padding:40px;display:grid;grid-template-columns:220px 1fr;gap:32px}header{grid-column:1/-1;border-bottom:2px solid #1c3738;padding-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:20px}header p:first-child{font:12px monospace;letter-spacing:2px}h1{font-size:64px;line-height:.9;margin:0}h1 em{color:#346751}h2{font-size:22px}#palette{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.swatch{height:48px;border:2px solid transparent;border-radius:50%;cursor:pointer}.swatch[aria-pressed=true]{outline:3px solid #1c3738;outline-offset:3px}#clear{padding:12px;width:100%;border:1px solid #1c3738;background:transparent;color:inherit;cursor:pointer}small{line-height:1.7}#grid{display:grid;grid-template-columns:repeat(32,1fr);aspect-ratio:4/3;background:#fff;touch-action:none;border:1px solid #1c3738}#grid button{padding:0;border:0;box-shadow:inset 0 0 0 .3px #ccc;background:#fff;min-width:0;cursor:crosshair}button:focus-visible{outline:3px solid #b84864;outline-offset:1px;z-index:1}section>p{font:12px monospace;text-align:right}@media(max-width:700px){main{padding:20px;grid-template-columns:1fr}header{display:block}h1{font-size:48px}#palette{grid-template-columns:repeat(6,1fr)}.swatch{height:36px}aside{display:grid;gap:12px}#palette{margin:0}section{min-width:0}}
</style></head><body><main><header><p>THE DOM COLLECTION / 01</p><h1>Coloring<br><em>Studio.</em></h1><p>A little space for a colorful idea.</p></header><aside><h2>Your palette</h2><div id="palette"></div><button id="clear">Clear canvas</button><p id="status" role="status">Choose a color, then paint.</p><small>Drag to draw. Use Tab and Enter to paint with a keyboard. White is the eraser.</small></aside><section aria-label="Drawing canvas"><div id="grid"></div><p>32 × 24 squares · endless possibilities</p></section></main><script src="solutions.js"></script></body></html>
