<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Currency Desk</title><link rel="stylesheet" href="../../../solutions.css"><style>main{max-width:700px}output{display:block;font-size:2rem;padding:1rem 0}.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:end}select{width:100%}@media(max-width:520px){.pair{grid-template-columns:1fr}}</style><main><small>CURRENCY DESK / ASYNCHRONOUS EXCHANGE</small><h1>From here<br>to there.</h1><section><label for="key">Your ExchangeRate-API key</label><input id="key" type="password" autocomplete="off" placeholder="Paste a personal key"><button id="connect">Load supported currencies</button><p>The key stays in memory for this page. <a href="https://app.exchangerate-api.com/sign-up">Get an API key</a>.</p></section><form id="converter"><label for="amount">Amount</label><input id="amount" type="number" min="0" step="any" value="100" required><div class="pair"><div><label for="from">From</label><select id="from" disabled></select></div><button type="button" id="switch" disabled aria-label="Switch currencies">⇄</button><div><label for="to">To</label><select id="to" disabled></select></div></div><button id="convert" disabled>Convert</button></form><p id="status" role="status">Add your key to fetch currencies.</p><output id="result" aria-live="polite"></output><small id="updated"></small></main><script src="solution.js"></script></html>
