<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three in a Row</title><link rel="stylesheet" href="../../../solutions.css"><style>main{max-width:650px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2rem 0}.board button{aspect-ratio:1;margin:0;font:4rem Georgia;background:#e0e8da;color:#193c35;border:1px solid #193c35}.board button:disabled{opacity:1}.board button:hover:not(:disabled){background:#c5d7bb}</style><main><p class="eyebrow">THREE IN A ROW / HUMAN × MACHINE</p><h1>Your move.</h1><label for="difficulty">Opponent</label><select id="difficulty"><option value="easy">Easy / random</option><option value="hard">Hard / unbeatable</option></select><p>Choose your symbol. X moves first.</p><button id="choose-x">Play X</button><button id="choose-o">Play O</button><div class="board" id="board" aria-label="Tic tac toe board"></div><p id="status" role="status">Choose a symbol to begin.</p><button id="restart" hidden>Play again</button></main><script src="solution.js"></script></html>
